<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#190824">
  <title>Rifas Peralta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      color: white;
      background: #190824;
    }

    .inicio {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      background: radial-gradient(
        circle at center,
        #491768,
        #190824 75%
      );
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    .boton-pavel {
      min-width: 200px;
      min-height: 60px;
      padding: 16px 36px;
      border: 1px solid #fff0b3;
      border-radius: 20px;
      background: linear-gradient(
        135deg, #fff0b3, #efc356, #bd821e
      );
      color: #301039;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 12px 36px #0006;
    }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 5px;
    }

    dialog {
      width: min(92vw, 480px);
      max-height: 85vh;
      max-height: 85dvh;
      overflow: auto;
      padding: 26px;
      border: 1px solid #eac565;
      border-radius: 24px;
      background: #240b32;
      color: white;
      box-shadow: 0 20px 70px #0009;
    }

    dialog::backdrop {
      background: #000b;
      backdrop-filter: blur(8px);
    }

    .cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0;
      color: #f6d77b;
      font-size: 28px;
    }

    .cerrar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 1px solid #ffffff40;
      border-radius: 12px;
      background: #ffffff10;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    .opciones {
      display: grid;
      gap: 16px;
    }

    .opcion {
      width: 100%;
      min-height: 64px;
      padding: 18px;
      border: 1px solid #dcb862;
      border-radius: 16px;
      background: linear-gradient(135deg, #45205b, #30113f);
      color: #ffe8a4;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    .opcion:disabled {
      opacity: 1;
      cursor: default;
    }

    .nota {
      margin: 22px 0 0;
      color: #d7c5df;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="inicio">
    <button
      id="abrirPanel"
      class="boton-pavel"
      type="button"
      aria-haspopup="dialog"
      aria-controls="panelPavel"
    >
      Pavel
    </button>
  </main>

  <dialog id="panelPavel" aria-labelledby="tituloPanel">
    <div class="cabecera">
      <h1 id="tituloPanel">Panel Pavel</h1>

      <button
        id="cerrarPanel"
        class="cerrar"
        type="button"
        aria-label="Cerrar panel"
      >
        ×
      </button>
    </div>

    <div class="opciones">
      <button class="opcion" type="button" disabled>
        Rifa
      </button>

      <button class="opcion" type="button" disabled>
        Verificador de boletos
      </button>

      <button class="opcion" type="button" disabled>
        Rifas activas
      </button>
    </div>

    <p class="nota">
      Las funciones de estos botones estarán disponibles próximamente.
    </p>
  </dialog>

  <script>
    const panel = document.getElementById("panelPavel");
    const abrir = document.getElementById("abrirPanel");
    const cerrar = document.getElementById("cerrarPanel");

    abrir.addEventListener("click", function () {
      if (!panel.open) {
        panel.showModal();
      }
    });

    cerrar.addEventListener("click", function () {
      panel.close();
    });

    panel.addEventListener("close", function () {
      abrir.focus();
    });
  </script>
</body>
</html>
