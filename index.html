<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061735">
  <title>Rifa Esperalta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #061735;
    }

    .pantalla {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: env(safe-area-inset-top)
               env(safe-area-inset-right)
               env(safe-area-inset-bottom)
               env(safe-area-inset-left);
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(
        ellipse at center,
        #103d78 0%,
        #061735 70%
      );
    }

    .banner {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      object-position: center;
    }
  </style>
</head>

<body>
  <main class="pantalla">
    <img
      class="banner"
      src="./rifa-esperalta.png"
      alt="Rifa Esperalta"
      fetchpriority="high"
    >
  </main>
</body>
</html>
