<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16051f">
  <title>Rifas Peralta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      background: #16051f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .pantalla {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(
        ellipse at center,
        #491267,
        #16051f 75%
      );
    }

    .imagen {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    button {
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .pavel {
      position: absolute;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      min-width: 160px;
      min-height: 50px;
      padding: 12px 30px;
      border: 1px solid #fff0b3;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        #fff0b3,
        #efc356,
        #bd821e
      );
      color: #301039;
      font-size: 19px;
      font-weight: bold;
      box-shadow: 0 6px 24px #0009;
    }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    dialog {
      width: min(92vw, 480px);
      max-height: 85vh;
      max-height: 85dvh;
      overflow: auto;
      padding: 24px;
      border: 1px solid #eac565;
      border-radius: 24px;
      background: #240b32;
      color: white;
      box-shadow: 0 20px 60px #0009;
    }

    dialog::backdrop {
      background: #000b;
      backdrop-filter: blur(7px);
    }

    .cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h2 {
      margin: 0;
      color: #f6d77b;
    }

    .cerrar {
      width: 44px;
      height: 44px;
      border: 1px solid #ffffff40;
      border-radius: 12px;
      background: #ffffff10;
      color: white;
      font-size: 26px;
    }

    .contenido {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid #ffffff25;
      border-radius: 16px;
      background: #ffffff08;
      line-height: 1.6;
    }

    .contenido p {
      margin: 0;
    }
  </style>
</head>

<body>
  <main class="pantalla">
    <img
      class="imagen"
      src="./rifas-peralta.jpeg"
      alt="Rifas Peralta: donde tu suerte te puede cambiar"
      fetchpriority="high"
    >

    <button
      class="pavel"
      id="abrirPanel"
      type="button"
      aria-haspopup="dialog"
      aria-controls="panelPavel"
    >
      Pavel
    </button>
  </main>

  <dialog id="panelPavel" aria-labelledby="tituloPanel">
    <div class="cabecera">
      <h2 id="tituloPanel">Panel Pavel</h2>

      <button
        class="cerrar"
        id="cerrarPanel"
        type="button"
        aria-label="Cerrar panel"
      >
        ×
      </button>
    </div>

    <div class="contenido">
      <p>
        Bienvenido, Pavel. Aquí agregaremos las funciones
        que elijas para Rifas Peralta.
      </p>
    </div>
  </dialog>

  <script>
    const panel = document.getElementById("panelPavel");
    const abrir = document.getElementById("abrirPanel");
    const cerrar = document.getElementById("cerrarPanel");

    abrir.addEventListener("click", function () {
      if (!panel.open) panel.showModal();
    });

    cerrar.addEventListener("click", function () {
      panel.close();
    });

    panel.addEventListener("close", function () {
      abrir.focus();
    });
  </script>
</body>
</html>
