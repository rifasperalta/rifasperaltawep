<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b16">
  <title>Rifas Peralta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: #071b16;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .pantalla {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        calc(20px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        calc(100px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
      background: radial-gradient(
        ellipse at center, #21543b, #071b16 75%
      );
    }

    .imagen {
      display: block;
      width: 100%;
      height: calc(100vh - 140px);
      height: calc(100dvh - 140px);
      object-fit: contain;
      object-position: center;
    }

    .alternativa {
      text-align: center;
      max-width: 500px;
    }

    .alternativa h1 {
      color: #f9d77c;
      font-size: clamp(36px, 8vw, 72px);
      margin: 0 0 16px;
    }

    .alternativa p {
      font-size: 20px;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    button {
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .boton-pavel {
      position: absolute;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      min-width: 180px;
      min-height: 54px;
      padding: 14px 32px;
      border: 1px solid #ffe6a3;
      border-radius: 18px;
      background: linear-gradient(135deg, #ffe6a3, #d7a63e);
      color: #192217;
      font-weight: bold;
      font-size: 19px;
      box-shadow: 0 8px 28px #0006;
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }

    dialog {
      width: min(92vw, 480px);
      max-height: 85vh;
      max-height: 85dvh;
      overflow: auto;
      padding: 28px;
      border: 1px solid #e9c969;
      border-radius: 24px;
      background: #102b22;
      color: #fff;
      box-shadow: 0 20px 70px #0008;
    }

    dialog::backdrop {
      background: #000b;
      backdrop-filter: blur(8px);
    }

    .cabecera-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .cabecera-panel h2 {
      margin: 0;
      color: #f9d77c;
      font-size: 28px;
    }

    .cerrar {
      width: 44px;
      height: 44px;
      border: 1px solid #ffffff40;
      border-radius: 14px;
      background: #ffffff10;
      color: #fff;
      font-size: 24px;
    }

    .contenido-panel {
      margin-top: 24px;
      padding: 22px;
      border: 1px solid #ffffff20;
      border-radius: 18px;
      background: #ffffff08;
      line-height: 1.6;
    }

    .contenido-panel p {
      margin: 0;
    }
  </style>
</head>

<body>
  <main class="pantalla" aria-label="Rifas Peralta">
    <img
      id="imagenPrincipal"
      class="imagen"
      src="./rifas-peralta.png"
      alt="Rifas Peralta, donde tu suerte te puede cambiar"
      fetchpriority="high"
    >

    <div id="alternativa" class="alternativa" hidden>
      <h1>Rifas Peralta</h1>
      <p>Donde tu suerte te puede cambiar</p>
    </div>

    <button
      id="abrirPanel"
      class="boton-pavel"
      type="button"
      aria-haspopup="dialog"
      aria-controls="panelPavel"
    >
      Pavel
    </button>
  </main>

  <dialog id="panelPavel" aria-labelledby="tituloPanel">
    <div class="cabecera-panel">
      <h2 id="tituloPanel">Panel Pavel</h2>

      <button
        id="cerrarPanel"
        class="cerrar"
        type="button"
        aria-label="Cerrar panel"
      >
        ×
      </button>
    </div>

    <div class="contenido-panel">
      <p>
        Bienvenido, Pavel. Aquí agregaremos las funciones
        y opciones de Rifas Peralta.
      </p>
    </div>
  </dialog>

  <script>
    const imagen = document.getElementById("imagenPrincipal");
    const alternativa = document.getElementById("alternativa");
    const panel = document.getElementById("panelPavel");
    const abrir = document.getElementById("abrirPanel");
    const cerrar = document.getElementById("cerrarPanel");

    function mostrarAlternativa() {
      imagen.hidden = true;
      alternativa.hidden = false;
    }

    imagen.addEventListener("error", mostrarAlternativa);

    if (imagen.complete && imagen.naturalWidth === 0) {
      mostrarAlternativa();
    }

    abrir.addEventListener("click", function () {
      if (!panel.open) {
        panel.showModal();
      }
    });

    cerrar.addEventListener("click", function () {
      panel.close();
    });

    panel.addEventListener("close", function () {
      abrir.focus();
    });
  </script>
</body>
</html>
